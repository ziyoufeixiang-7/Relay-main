<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA 波形指令测试平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #3b82f6;
            --accent-hover: #60a5fa;
            --danger: #ef4444;
            --success: #10b981;
            --glass-blur: blur(12px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        button {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent-primary);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        button.danger {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        button.danger:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .form-group label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        input, select {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-primary);
        }

        .log-panel {
            grid-column: 1 / -1;
            background: #020617;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            padding: 1rem;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.875rem;
            color: #a7f3d0;
        }

        .log-entry {
            margin-bottom: 0.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.25rem;
        }
        
        .log-error {
            color: #fca5a5;
        }
    </style>
</head>
<body>

    <h1>FPGA 测试终端</h1>

    <div class="container">
        <!-- 基础系统指令 -->
        <div class="card">
            <h2>系统控制指令 (System Cmds)</h2>
            <div class="btn-group">
                <button onclick="sendSysCmd('SYS_START')">▶ START</button>
                <button class="danger" onclick="sendSysCmd('SYS_STOP')">■ STOP</button>
                <button class="danger" onclick="sendSysCmd('SYS_RESET')">⟲ RESET</button>
            </div>
            <div class="btn-group">
                <button onclick="sendSysCmd('SYS_UPDATE')">↻ UPDATE (Ping-Pong)</button>
                <button onclick="sendSysCmd('SYS_SYNC')">⇈ SYNC (对齐)</button>
            </div>
        </div>

        <!-- 杂项设置 -->
        <div class="card">
            <h2>硬件设置 (Misc)</h2>
            <div class="form-group">
                <label>DBNC 防抖滤波时间 (ms)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="number" id="dbnc_val" value="1.0" step="0.1" style="flex: 1;">
                    <button onclick="sendSysCmdWithVal('SYS_SET_DBNC', 'dbnc_val')">发送</button>
                </div>
            </div>
            <div class="form-group">
                <label>DO 数字输出掩码 (Hex/Dec)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="do_val" value="0xFFFF" style="flex: 1;">
                    <button onclick="sendSysCmdWithVal('SYS_SET_DO', 'do_val')">发送</button>
                </div>
            </div>
        </div>

        <!-- DDS 参数控制 -->
        <div class="card" style="grid-column: span 2;">
            <h2>DDS 参数设置 (Param Cmds)</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label>指令类型 (Command)</label>
                    <select id="param_cmd">
                        <option value="DDS_WR_SHADOW">WR_SHADOW (写 Base+Shadow)</option>
                        <option value="DDS_WR_STAGE">WR_STAGE (仅写 Shadow)</option>
                        <option value="DDS_STEP_SHADOW">STEP_SHADOW (步进 Base+Shadow)</option>
                        <option value="DDS_STEP_STAGE">STEP_STAGE (仅步进 Shadow)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>通道掩码 (Channel Mask - 0x0000 到 0xFFFF)</label>
                    <input type="text" id="param_chmask" value="0xFFFF">
                </div>
                <div class="form-group">
                    <label>层级索引 (Index 0-63=AC, 255=DC)</label>
                    <input type="number" id="param_index" value="255" min="0" max="255">
                </div>
                <div class="form-group">
                    <label>幅度 Amplitude (-10V 到 +10V)</label>
                    <input type="number" id="param_amp" value="5.0" step="0.1">
                </div>
                <div class="form-group">
                    <label>频率(Hz) 或 相位(°)</label>
                    <input type="number" id="param_freq_phase" value="50.0" step="0.1">
                </div>
            </div>
            <button style="width: 100%; margin-top: 1rem;" onclick="sendParamCmd()">🚀 发送波形参数</button>
        </div>

        <!-- 相位门控 -->
        <div class="card">
            <h2>相位门控 (Phase Gate)</h2>
            <div class="form-group">
                <label>物理通道 (Physical Channel 0-15)</label>
                <input type="number" id="gate_ch" value="0" min="0" max="15">
            </div>
            <div class="form-group">
                <label>目标触发相位 (°)</label>
                <input type="number" id="gate_phase" value="0.0" step="0.1">
            </div>
            <button style="width: 100%; margin-top: 0.5rem;" onclick="sendPhaseGate()">⏱️ 发送门控指令</button>
        </div>

        <!-- 终端日志 -->
        <div class="log-panel" id="logPanel">
            <div class="log-entry">System ready. UART /dev/ttyAMA0 configured at 230400.</div>
        </div>
    </div>

    <script>
        function log(msg, isError = false) {
            const panel = document.getElementById('logPanel');
            const entry = document.createElement('div');
            entry.className = 'log-entry' + (isError ? ' log-error' : '');
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        async function postData(url, data) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const res = await response.json();
                if (!response.ok) throw new Error(res.error || 'Server error');
                log(`Sent: ${res.sent}`);
            } catch (err) {
                log(`Error: ${err.message}`, true);
            }
        }

        function sendSysCmd(cmd) {
            postData('/api/sys_cmd', { cmd });
        }

        function sendSysCmdWithVal(cmd, inputId) {
            let val = document.getElementById(inputId).value;
            if(val.startsWith('0x') || val.startsWith('0X')) {
                val = parseInt(val, 16);
            } else {
                val = parseFloat(val);
            }
            postData('/api/sys_cmd', { cmd, val });
        }

        function sendParamCmd() {
            let chMaskStr = document.getElementById('param_chmask').value;
            let chMask = chMaskStr.startsWith('0x') ? parseInt(chMaskStr, 16) : parseInt(chMaskStr);
            
            const data = {
                cmd: document.getElementById('param_cmd').value,
                regIndex: parseInt(document.getElementById('param_index').value),
                chMask: chMask,
                amplitude: parseFloat(document.getElementById('param_amp').value),
                freqOrPhase: parseFloat(document.getElementById('param_freq_phase').value)
            };
            postData('/api/param_cmd', data);
        }

        function sendPhaseGate() {
            const data = {
                physical_ch: parseInt(document.getElementById('gate_ch').value),
                phase: parseFloat(document.getElementById('gate_phase').value)
            };
            postData('/api/phase_gate', data);
        }
    </script>
</body>
</html>
